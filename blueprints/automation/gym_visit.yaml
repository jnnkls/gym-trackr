blueprint:
  name: Gym Trackr - log gym visit
  description: >-
    Writes one calendar event per gym visit (zone enter to leave) to a local
    calendar. Visits shorter than the minimum are discarded, long visits are
    capped and marked with "⚠ Ende geschätzt". Needs an input_datetime helper
    with date and time.
  domain: automation
  source_url: https://github.com/jnnkls/gym-trackr/blob/main/blueprints/automation/gym_visit.yaml
  input:
    person:
      name: Person or device tracker
      selector:
        entity:
          filter:
            - domain: person
            - domain: device_tracker
    zone:
      name: Gym zone
      selector:
        entity:
          filter:
            - domain: zone
    calendar:
      name: Calendar
      description: Local calendar that receives the visits.
      selector:
        entity:
          filter:
            - domain: calendar
    start_helper:
      name: Visit start helper
      description: input_datetime with date and time. 1970-01-01 00:00:00 means no open visit (any 00:00:00 time counts as closed).
      selector:
        entity:
          filter:
            - domain: input_datetime
    min_minutes:
      name: Minimum visit duration (minutes)
      default: 15
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: min
    max_hours:
      name: Maximum visit duration (hours)
      default: 4
      selector:
        number:
          min: 1
          max: 24
          unit_of_measurement: h

mode: queued
max: 10

trigger_variables:
  helper: !input start_helper
  max_hours: !input max_hours

triggers:
  - trigger: zone
    id: enter
    entity_id: !input person
    zone: !input zone
    event: enter
  - trigger: zone
    id: leave
    entity_id: !input person
    zone: !input zone
    event: leave
  - trigger: template
    id: cap
    value_template: >-
      {{ states(helper) is match('^[0-9]{4}-[0-9][0-9]-[0-9][0-9]') and not states(helper).endswith(' 00:00:00')
         and as_datetime(states(helper), none) is not none
         and now() - (as_datetime(states(helper)) | as_local)
             >= timedelta(hours=max_hours | float) }}
  - trigger: homeassistant
    id: start
    event: start

actions:
  # Evaluated when the queued run starts, so racing triggers see the closed helper.
  - variables:
      helper: !input start_helper
      person: !input person
      calendar_entity: !input calendar
      min_minutes: !input min_minutes
      max_hours: !input max_hours
      # unknown/unavailable/unparsable or a 00:00:00 time counts as closed (HA's input_datetime
      # defaults to "<today> 00:00:00" without restored state).
      # shortcut: a real start at exactly 00:00:00 is misread as closed (1 in 86400), not worth a second marker.
      is_open: "{{ states(helper) is match('^[0-9]{4}-[0-9][0-9]-[0-9][0-9]') and not states(helper).endswith(' 00:00:00') and as_datetime(states(helper), none) is not none }}"
      now_ts: "{{ now().timestamp() }}"
      # epoch seconds; native templates would turn datetimes into strings.
      # The helper is naive local time: in the DST fall-back hour take the later
      # reading unless it lies in the future.
      started: >-
        {% if is_open %}{% set s = as_datetime(states(helper)) | as_local %}
        {% set later = as_timestamp(s.replace(fold=1)) %}
        {{ later if later <= now_ts else as_timestamp(s) }}{% else %}0{% endif %}
      cap_end: "{{ started + max_hours | float * 3600 }}"
      # open for at least the cap: an enter then closes it first
      stale: "{{ is_open and now_ts - started >= max_hours | float * 3600 }}"
      fmt: "%Y-%m-%d %H:%M:%S%z"
      helper_fmt: "%Y-%m-%d %H:%M:%S"
  - choose:
      - conditions: "{{ trigger.id == 'enter' and not is_open }}"
        sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: !input start_helper
            data:
              datetime: "{{ now().strftime(helper_fmt) }}"
    default:
      - choose:
          # Closed or re-enter while open (and not stale): nothing to do.
          - conditions: "{{ not is_open or (trigger.id == 'enter' and not stale) }}"
            sequence: []
          # Restart while still in the zone, or tracker not known yet: keep the visit.
          - conditions:
              - "{{ trigger.id == 'start' }}"
              - condition: or
                conditions:
                  - condition: zone
                    entity_id: !input person
                    zone: !input zone
                  - "{{ states(person) in ['unknown', 'unavailable'] }}"
            sequence: []
        default:
          - variables:
              duration: "{{ now_ts - started }}"
              capped: "{{ trigger.id in ['cap', 'start', 'enter'] or duration > max_hours | float * 3600 }}"
              write: "{{ trigger.id == 'cap' or duration >= min_minutes | float * 60 or duration > max_hours | float * 3600 }}"
              ends: "{{ [now_ts, cap_end] | min if capped else now_ts }}"
          - if: "{{ write }}"
            then:
              - action: calendar.create_event
                target:
                  entity_id: !input calendar
                data: >-
                  {{ {'summary': 'Gym',
                      'start_date_time': started | timestamp_custom(fmt),
                      'end_date_time': ends | timestamp_custom(fmt)}
                     | combine({'description': '⚠ Ende geschätzt'} if capped else {}) }}
          - action: input_datetime.set_datetime
            target:
              entity_id: !input start_helper
            data:
              datetime: "1970-01-01 00:00:00"
          # Stale visit closed by a new enter: the new visit starts now.
          - if: "{{ trigger.id == 'enter' }}"
            then:
              - action: input_datetime.set_datetime
                target:
                  entity_id: !input start_helper
                data:
                  datetime: "{{ now().strftime(helper_fmt) }}"
